name: PR build downloads

on:
  workflow_run:
    workflows: [Package applications]
    types: [in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

# Serialize comment updates, including runs for the same commit and reruns.
concurrency:
  group: pr-build-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # workflow_run uses the default branch. Never check out the PR or execute
      # its artifacts in this job, which has permission to write PR comments.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        with:
          script: |
            const updateComment = require('./.github/scripts/pr-build-comment.cjs');
            await updateComment({ github, context, core });
