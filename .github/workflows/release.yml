name: Package applications
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            platform: linux-x64
            formats: deb,appimage
          - os: blacksmith-6vcpu-macos-15
            platform: macos-arm64
            formats: app,dmg
          - os: blacksmith-4vcpu-windows-2025
            platform: windows-x64
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Package desktop application
        uses: ./.github/actions/package-desktop
        with:
          formats: ${{ matrix.formats }}
          artifact-name: tusklet-${{ matrix.platform }}
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 0 }}
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
