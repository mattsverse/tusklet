name: Package release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            formats: deb
          - os: blacksmith-6vcpu-macos-15
            formats: app,dmg
          - os: blacksmith-4vcpu-windows-2025
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev libxcb-damage0-dev libxcb-randr0-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - run: cargo test --locked --no-default-features
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build and package
        run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Generate checksums
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.dmg', '.deb', '.exe' })
          if ($packages.Count -eq 0) { throw 'No release packages were generated.' }
          foreach ($package in $packages) {
            $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)" | Set-Content -Path "$($package.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: handypos-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
