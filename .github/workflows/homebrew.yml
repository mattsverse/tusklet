name: Publish Homebrew cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to publish or retry (for example v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo 'Set HOMEBREW_TAP_TOKEN with Contents: Read and write access to mattsverse/homebrew-tap.' >&2
            exit 1
          fi
          if [ "$(gh api "repos/$SOURCE_REPOSITORY" --jq '.private')" != false ]; then
            echo 'Tusklet must be public so Homebrew users can download its release assets.' >&2
            exit 1
          fi
      - name: Validate and download published installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$SOURCE_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          python3 .github/scripts/homebrew.py release.json
          gh release download "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --dir release-assets \
            --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.sha256'
      - name: Check out the tap
        uses: actions/checkout@v7.0.1
        with:
          repository: mattsverse/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Generate and validate cask
        run: |
          set -euo pipefail
          python3 .github/scripts/homebrew.py release.json \
            --assets release-assets --output homebrew-tap/Casks/tusklet.rb
          ruby -c homebrew-tap/Casks/tusklet.rb
      - name: Commit and push cask
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/tusklet.rb
          if git diff --cached --quiet; then
            echo 'The tap already contains this release.'
            exit 0
          fi
          git commit -m "chore(tusklet): release $RELEASE_TAG"
          git push
